name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Prerelease versions (e.g. 0.1.1-staging.0) go to the `staging` dist-tag;
      # clean versions go to `latest`. Pin to a staging build with
      # `npm install @superlog/expo@staging`.
      - name: Publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then DIST_TAG="staging"; else DIST_TAG="latest"; fi
          echo "Publishing $VERSION to dist-tag '$DIST_TAG'"
          npm publish --access public --provenance --tag "$DIST_TAG"
