name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Staged publishing needs npm >= 11.15.0; the Node 24 bundled npm may lag.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Submit the build to npm's staging area (no 2FA required). It does NOT go
      # public here — a maintainer reviews and runs `npm stage approve <id>`
      # (2FA), or approves via npmjs.com. List staged builds: `npm stage list
      # @superlog/expo`.
      - name: Stage publish for review
        run: npm stage publish --access public --provenance
